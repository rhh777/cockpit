name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify tag matches package version
        run: node -e "const p=require('./package.json');if(process.env.GITHUB_REF_NAME!=='v'+p.version)throw new Error('tag must equal v'+p.version)"
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  package:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            script: electron:build:mac
          - os: windows-latest
            platform: windows
            script: electron:build:win
          - os: ubuntu-latest
            platform: linux
            script: electron:build:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools rpm
      - run: pnpm install --frozen-lockfile
      # 只在 secret 非空时才导出签名环境变量。
      # electron-builder 看到 CSC_LINK 已定义(哪怕是空字符串)就会进证书导入流程,
      # 把空路径解析成工作目录并以 "not a file" 失败,所以不能用 `|| ''` 兜底。
      - name: Configure code signing
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -eu
          if [ "$RUNNER_OS" = "macOS" ]; then
            if [ -n "${MAC_CSC_LINK:-}" ]; then
              printf 'CSC_LINK=%s\n' "$MAC_CSC_LINK" >> "$GITHUB_ENV"
              printf 'CSC_KEY_PASSWORD=%s\n' "${MAC_CSC_KEY_PASSWORD:-}" >> "$GITHUB_ENV"
              # 三个公证变量必须齐全,缺一个就整体跳过公证,避免 notarytool 中途报错。
              if [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_APP_SPECIFIC_PASSWORD:-}" ] && [ -n "${APPLE_TEAM_ID:-}" ]; then
                printf 'APPLE_ID=%s\n' "$APPLE_ID" >> "$GITHUB_ENV"
                printf 'APPLE_APP_SPECIFIC_PASSWORD=%s\n' "$APPLE_APP_SPECIFIC_PASSWORD" >> "$GITHUB_ENV"
                printf 'APPLE_TEAM_ID=%s\n' "$APPLE_TEAM_ID" >> "$GITHUB_ENV"
              else
                echo "::warning::Signing certificate present but notarization credentials are incomplete — skipping notarization."
              fi
            else
              echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
              echo "::warning::No macOS signing certificate configured — producing an unsigned build."
            fi
          elif [ "$RUNNER_OS" = "Windows" ] && [ -n "${WIN_CSC_LINK:-}" ]; then
            printf 'CSC_LINK=%s\n' "$WIN_CSC_LINK" >> "$GITHUB_ENV"
            printf 'CSC_KEY_PASSWORD=%s\n' "${WIN_CSC_KEY_PASSWORD:-}" >> "$GITHUB_ENV"
          fi
      - name: Build packages
        run: pnpm ${{ matrix.script }}
      # 只收安装包本身。release/ 下还有 mac/、mac-arm64/ 这类解包目录(每个约 300MB),
      # 传上去既拖慢 CI,又会让 publish 阶段把目录当成 release asset。
      - uses: actions/upload-artifact@v4
        with:
          name: cockpit-${{ matrix.platform }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.tar.gz
            release/latest*.yml
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      # 必须用块标量:单行 plain scalar 里「空格 + #」会被 YAML 当成注释截断。
      # 校验和按 release asset 的扁平文件名列出,下载者才能直接比对。
      - name: Create checksums
        working-directory: artifacts
        run: |
          find . -type f ! -name 'SHA256SUMS.txt' -exec sha256sum {} + \
            | awk '{ name = $2; sub(/.*\//, "", name); print $1 "  " name }' \
            | sort -k2 > SHA256SUMS.txt
          cat SHA256SUMS.txt
      # 这个 job 不 checkout 源码,gh 没有 git 上下文可推断目标仓库,
      # 必须用 GH_REPO 显式指定,否则报 "not a git repository"。
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/*/* artifacts/SHA256SUMS.txt --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
